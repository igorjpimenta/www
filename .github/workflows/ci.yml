name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: typecheck + build + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (astro check + astro build)
        run: npm run build

      - name: Lint (no writes)
        run: npx biome check .
